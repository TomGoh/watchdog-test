# SPDX-License-Identifier: GPL-2.0
#
# watchdog-test — cross-platform Rust suite for kernel watchdog drivers.
#
# A single static binary that auto-discovers /sys/class/watchdog/* on the
# running system and runs a matrix of conformance + per-driver tests
# against the kernel's watchdog uapi.  Built to validate the Rust-ported
# watchdog drivers (softdog / sp5100_tco / sbsa_gwdt) regression-free
# across both x86_64 and arm64 targets.

[workspace]
resolver = "2"
members  = [
    "crates/wdctl",
    "crates/tests-common",
    "crates/tests",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "GPL-2.0"
repository = "https://your-internal-repo/watchdog-test.git"
authors    = ["KylinOS kernel team"]
rust-version = "1.74"

[workspace.dependencies]
# Type-safe ioctl wrappers (used by wdctl crate)
nix          = { version = "0.27", features = ["ioctl", "fs"] }
# Parametrized tests
rstest       = "0.18"
# Force sequential execution where /dev/watchdog0 is involved
serial_test  = "3"
# Ergonomic error handling for tests
anyhow       = "1"
# Logging from the test harness itself
log          = "0.4"
env_logger   = "0.11"

[profile.release]
# A static binary that scp'd to the target "just runs", small enough to
# copy quickly even on slow networks.
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[profile.dev]
opt-level = 0
debug     = true
